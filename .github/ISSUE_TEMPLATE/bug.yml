name: Bug report
description: Something in the blueprint is broken or contradicts itself
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste content from your own Second Brain here.** Use made-up
        text or the fictional files in `examples/` to show the problem.
  - type: textarea
    id: what
    attributes:
      label: What is wrong?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      placeholder: |
        1.
        2.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Agent and version, Python version, and the output of `python3 00-system/scripts/linkcheck.py --orphans` if relevant.
